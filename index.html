<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0a">
<title>WeWe</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0a0a0a}
body{font-family:'Inter',system-ui,sans-serif;color:#f0f0f0;display:flex;flex-direction:column;font-size:15px}

/* ── Header ── */
.hdr{background:#0a0a0a;padding:env(safe-area-inset-top,0px) 20px 0;flex-shrink:0}
.hdr-inner{display:flex;justify-content:space-between;align-items:center;padding:14px 0 12px;border-bottom:1px solid #222}
.appname{font-size:18px;font-weight:600;letter-spacing:3px;color:#fff}
.hdr-right{display:flex;align-items:center;gap:14px}
.hdate{font-size:12px;color:#555;font-weight:400}
.reset-btn{font-size:13px;color:#333;cursor:pointer;padding:6px;line-height:1}

/* ── Tab bar ── */
.tabs{display:flex;background:#0a0a0a;border-bottom:1px solid #1a1a1a;flex-shrink:0;padding:0 20px}
.tab{flex:1;text-align:center;padding:11px 0 10px;font-size:13px;font-weight:500;color:#444;cursor:pointer;border-bottom:2px solid transparent;letter-spacing:.5px;transition:color .15s}
.tab.active{color:#fff;border-bottom-color:#fff}

/* ── Content ── */
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:#0a0a0a;position:relative}
.tab-pane{display:none}
.tab-pane.active{display:block}

/* ── Body tab — fills screen ── */
.body-tab{display:flex;flex-direction:column;align-items:center;padding:20px 0 0}
.svg-container{flex:1;display:flex;justify-content:center;align-items:flex-start;width:100%;padding:0 24px}
.svg-container svg{width:100%;max-width:340px;height:auto}
.view-btns{display:flex;gap:0;margin:16px 20px 0;border:1px solid #222;border-radius:8px;overflow:hidden;background:#111;align-self:stretch}
.vbtn{flex:1;padding:12px 0;font-size:13px;font-weight:500;color:#555;text-align:center;cursor:pointer;transition:all .15s;letter-spacing:.3px}
.vbtn.active{background:#fff;color:#000}
.today-banner{margin:12px 20px 20px;background:#111;border:1px solid #1e1e1e;border-radius:10px;padding:12px 14px}
.today-banner-title{font-size:11px;font-weight:600;color:#444;letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px}
.today-item{display:flex;align-items:center;gap:10px;padding:5px 0}
.today-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.today-name{font-size:13px;color:#ccc;flex:1}
.today-status{font-size:11px;font-weight:500}
.today-done{color:#2a9d2a}
.today-pending{color:#e0874a}
.today-due{color:#cf4444}

/* ── List tab ── */
.add-row{display:flex;align-items:center;gap:12px;padding:16px 20px;background:#111;border-bottom:1px solid #1a1a1a;cursor:pointer;min-height:56px}
.add-row:active{background:#1a1a1a}
.plus-icon{width:28px;height:28px;border:1.5px solid #333;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;color:#555;line-height:1;flex-shrink:0}
.add-row span{font-size:14px;color:#555;font-weight:400}
.cond-item{display:flex;align-items:flex-start;gap:12px;padding:14px 20px;background:#0a0a0a;border-bottom:1px solid #141414;cursor:pointer;min-height:60px;user-select:none;position:relative}
.cond-item:active{background:#111}
.cond-item.done-today{opacity:.55}
.cinfo{flex:1;min-width:0}
.cname{font-size:15px;font-weight:500;line-height:1.3;color:#f0f0f0}
.csub{font-size:12px;color:#444;margin-top:3px;font-weight:400}
.bar-row{display:flex;align-items:center;gap:7px;margin-top:6px}
.btrack{flex:1;height:3px;background:#1a1a1a;border-radius:2px;overflow:hidden}
.bfill{height:100%;border-radius:2px;transition:width .4s ease}
.done-badge{position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:600;color:#2a9d2a;letter-spacing:.3px}

/* ── Bottom sheet ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:90;opacity:0;pointer-events:none;transition:opacity .22s}
.overlay.show{opacity:1;pointer-events:all}
.sheet{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;border-radius:20px 20px 0 0;z-index:100;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);padding-bottom:env(safe-area-inset-bottom,20px)}
.sheet.show{transform:translateY(0)}
.sheet-handle{width:36px;height:3px;background:#333;border-radius:2px;margin:12px auto 0}
.sheet-title{font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:#444;padding:14px 20px 12px;border-bottom:1px solid #1a1a1a}
.sheet-body{padding:16px 20px 16px}

/* ── Detail sheet ── */
.d-region{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#444;margin-bottom:4px}
.d-name{font-size:22px;font-weight:600;line-height:1.2;margin-bottom:10px}
.d-meta{font-size:13px;color:#666;line-height:2;margin-bottom:4px}
.d-meta strong{color:#aaa;font-weight:500}
.d-actions{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.dact{width:100%;padding:15px 18px;font-size:14px;font-weight:500;border:1px solid #222;background:#1a1a1a;cursor:pointer;border-radius:10px;text-align:left;color:#ccc;transition:background .15s}
.dact:active{background:#222}
.dact.primary{border-color:#2a7a2a;color:#3dba3d;background:#0f1f0f}
.dact.secondary-action{border-color:#1a1a1a;color:#555}
.dact.green{border-color:#1a3a2a;color:#3dba3d}
.dact.danger{border-color:#3a1a1a;color:#cf4444}
.dact:disabled{opacity:.3;cursor:not-allowed}
.pfeedback{font-size:13px;color:#555;margin-top:10px;min-height:18px;font-weight:400}

/* ── Tap sheet ── */
.tp-entry{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #1a1a1a;cursor:pointer;min-height:52px}
.tp-entry:last-child{border-bottom:none}
.tp-entry:active{opacity:.7}

/* ── Form ── */
.form-row{margin-bottom:18px}
.flabel{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#444;margin-bottom:6px}
.fval{font-size:16px;color:#f0f0f0;border:none;border-bottom:1px solid #2a2a2a;background:transparent;width:100%;padding:8px 0;outline:none;font-family:'Inter',sans-serif;font-weight:400}
.fval::placeholder{color:#2a2a2a}
select.fval{cursor:pointer;color:#888}
select.fval option{background:#111;color:#f0f0f0}
select.fval optgroup{color:#444}
.freq-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.freq-chip{font-size:13px;font-weight:500;padding:8px 14px;border:1px solid #222;border-radius:20px;cursor:pointer;background:#0a0a0a;color:#555;user-select:none;transition:all .12s;min-height:38px;display:flex;align-items:center}
.freq-chip.selected{background:#fff;color:#000;border-color:#fff}
.freq-interval{display:flex;align-items:center;gap:10px;margin-top:10px}
.freq-interval input{width:60px;font-size:16px;color:#f0f0f0;border:none;border-bottom:1px solid #2a2a2a;background:transparent;padding:6px 0;outline:none;text-align:center;font-family:'Inter',sans-serif}
.freq-interval label{font-size:13px;color:#444}
.form-actions{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.fact{width:100%;padding:15px 18px;font-size:14px;font-weight:600;border:1px solid #222;background:#1a1a1a;cursor:pointer;border-radius:10px;text-align:center;color:#ccc;letter-spacing:.3px}
.fact.primary{border-color:#2a7a2a;color:#3dba3d;background:#0f1f0f}
.ferr{font-size:13px;color:#cf4444;margin-top:8px;min-height:18px}

/* ── Confirm ── */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px}
.confirm-box{background:#111;border:1px solid #222;border-radius:16px;padding:24px 20px;max-width:340px;width:100%}
.confirm-msg{font-size:15px;color:#ccc;margin-bottom:20px;line-height:1.5;font-weight:400}
.confirm-btns{display:flex;gap:10px}
.confirm-btns button{flex:1;padding:14px;font-size:14px;font-weight:600;border:1px solid #222;background:#1a1a1a;cursor:pointer;border-radius:10px;color:#666;font-family:'Inter',sans-serif}
.confirm-btns button.yes{border-color:#3a1a1a;color:#cf4444}

/* ── Save indicator ── */
.save-ind{position:fixed;top:18px;right:20px;font-size:11px;font-weight:600;color:#2a9d2a;z-index:150;opacity:0;transition:opacity .3s;letter-spacing:.3px}
.save-ind.show{opacity:1}

/* ── SVG regions ── */
.region{cursor:pointer}

/* ── Hint ── */
.hint{font-size:12px;color:#2a2a2a;padding:12px 20px;text-align:center;font-weight:400}

::-webkit-scrollbar{width:0}
</style>
</head>

</div>

<!-- Detail Sheet -->
<div class="sheet" id="detailSheet">
  <div class="sheet-handle"></div>

<script>
// ── Helpers ──────────────────────────────────────────────────────
function todayStr(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}

// ── Frequency helpers (hours-based) ──────────────────────────────
// c.timesPerDay = how many times per day (1-8)
// c.interval    = days between treatment days (1 = every day)
// c.logsToday   = { 'YYYY-M-D': [timestamp_ms, ...] }
// Min wait between logs = (24/n)h * 0.75  (25% tolerance)

function minHoursBetween(c){
  var n=c.timesPerDay||1;
  var win=24/n;
  return win*0.75;
}
function logsTodayArr(c){
  if(!c.logsToday)return[];
  return c.logsToday[todayStr()]||[];
}
function logsTodayCount(c){return logsTodayArr(c).length;}
function allSlotsDoneToday(c){return logsTodayCount(c)>=(c.timesPerDay||1);}
function isDoneToday(c){return allSlotsDoneToday(c);}
function canLogNow(c){
  if(!needsTreatment[c.status])return false;
  if(!isDueToday(c))return false;
  var logs=logsTodayArr(c);
  var needed=c.timesPerDay||1;
  if(logs.length>=needed)return false;
  if(logs.length===0)return true;
  var hoursSince=(Date.now()-logs[logs.length-1])/3600000;
  return hoursSince>=minHoursBetween(c);
}
function hoursUntilNext(c){
  var logs=logsTodayArr(c);
  if(logs.length===0)return 0;
  var hoursSince=(Date.now()-logs[logs.length-1])/3600000;
  return Math.max(0,minHoursBetween(c)-hoursSince);
}
function isDueToday(c){
  if(!needsTreatment[c.status])return false;
  var interval=c.interval||1;
  if(interval<=1)return true;
  if(!c.lastStreakDay)return true;
  var last=new Date(c.lastStreakDay),today=new Date();today.setHours(0,0,0,0);
  return Math.round((today-last)/86400000)>=interval;
}
function cleanLogs(c){
  if(!c.logsToday)c.logsToday={};
  var today=todayStr();
  Object.keys(c.logsToday).forEach(function(k){if(k!==today)delete c.logsToday[k];});
}
function freqLabel(c){
  var n=c.timesPerDay||1;
  var iv=c.interval||1;
  var s=n+'× täglich';
  if(iv>1)s+=' · alle '+iv+' Tage';
  return s;
}

// ── Storage ──────────────────────────────────────────────────────
var STORAGE_KEY='wewe_v14';
var DEMO=[
  {name:'Schulterimpingement',region:'Rechte Schulter',action:'Pendulum-Übung',timesPerDay:2,interval:1,day:23,total:60,status:'red',streak:3,logsToday:{},lastStreakDay:''},
  {name:'Meniskus-Reizung',region:'Linkes Knie',action:'Kräftigungsübung',timesPerDay:1,interval:2,day:14,total:45,status:'amber',streak:5,logsToday:{},lastStreakDay:''},
  {name:'Chron. Hüftschwäche',region:'Hüfte',action:'Mobilisierungsübung',timesPerDay:1,interval:1,day:0,total:0,status:'blue',streak:0,logsToday:{},lastStreakDay:''},
  {name:'Alte Knieverletzung',region:'Rechtes Knie',action:'',timesPerDay:1,interval:1,day:0,total:0,status:'blue_inactive',streak:0,logsToday:{},lastStreakDay:''}
];
function loadConditions(){try{var r=localStorage.getItem(STORAGE_KEY);if(r)return JSON.parse(r);}catch(e){}return JSON.parse(JSON.stringify(DEMO));}
function saveConditions(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(conditions));}catch(e){}
  var ind=document.getElementById('saveInd');
  ind.classList.add('show');clearTimeout(ind._t);ind._t=setTimeout(function(){ind.classList.remove('show');},1400);
}
function resetData(){
  showConfirm('Alle Diagnosen wirklich löschen?','Löschen',function(){
    localStorage.removeItem(STORAGE_KEY);
    conditions=JSON.parse(JSON.stringify(DEMO));
    closeAll();renderList();updateBodyColors();renderTodayBanner();
  });
}

var conditions=loadConditions();

// Migrate old format (lastActed → logsToday) and clean logs on load
conditions.forEach(function(c){
  if(!c.logsToday) c.logsToday={};
  cleanLogs(c);
  // Streak decay: if last streak day was >1 day ago and all slots weren't completed yesterday
  if(c.streak && c.lastStreakDay){
    var last=new Date(c.lastStreakDay),today=new Date();today.setHours(0,0,0,0);
    var diff=Math.round((today-last)/86400000);
    if(diff>1) c.streak=0; // missed a day
  }
});

// ── Status config ────────────────────────────────────────────────
var statusColors={
  red:          {dot:'#cf4444',name:'#cf4444',bar:'#cf4444'},
  amber:        {dot:'#e0874a',name:'#e0874a',bar:'#e0874a'},
  blue:         {dot:'#4a8fe0',name:'#4a8fe0',bar:'#4a8fe0'},
  blue_inactive:{dot:'#2a4a6a',name:'#3a6a9a',bar:'#2a4a6a'},
  probhealed:   {dot:'#2a9d2a',name:'#2a9d2a',bar:'#2a9d2a'},
  undiag:       {dot:'#444',   name:'#555',   bar:'#333'}
};
var statusLabels={
  red:'Akut',amber:'Behandelt',blue:'Chronisch (aktiv)',
  blue_inactive:'Chronisch (inaktiv)',probhealed:'Wsl. gesund',undiag:'Undiagnostiziert'
};
var needsTreatment={red:true,amber:true,blue:true};
var statusFills={
  red:          {fill:'#3d1414',stroke:'#cf4444',sw:'1.5'},
  amber:        {fill:'#3d2a0a',stroke:'#e0874a',sw:'1.5'},
  blue:         {fill:'#0a2040',stroke:'#4a8fe0',sw:'1.5'},
  blue_inactive:{fill:'#111824',stroke:'#2a4a6a',sw:'1'},
  probhealed:   {fill:'#0a2a0a',stroke:'#2a9d2a',sw:'1.5'},
  undiag:       {fill:'#1e1e1e',stroke:'#555',   sw:'1'},
  none:         {fill:'#1a1a1a',stroke:'#333',   sw:'1'}
};
var statusPriority={red:5,amber:4,blue:3,undiag:2,blue_inactive:1,probhealed:1};

// ── Date header ──────────────────────────────────────────────────
document.getElementById('hdate').textContent=new Date().toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit',year:'numeric'});

// ── Tab switching ────────────────────────────────────────────────
var currentTab='body';
function switchTab(t){
  currentTab=t;
  ['body','list'].forEach(function(x){
    document.getElementById('tab-'+x).className='tab'+(t===x?' active':'');
    document.getElementById('pane-'+x).className='tab-pane'+(t===x?' active':'');
  });
}

// ── View toggle ──────────────────────────────────────────────────
function setView(v){
  document.getElementById('svgFront').style.display=v==='front'?'flex':'none';
  document.getElementById('svgBack').style.display=v==='back'?'flex':'none';
  document.getElementById('btn-front').className='vbtn'+(v==='front'?' active':'');
  document.getElementById('btn-back').className='vbtn'+(v==='back'?' active':'');
  closeAll();
}

// ── Sheet management ─────────────────────────────────────────────
var activeSheet=null;
function openSheet(id){
  if(activeSheet&&activeSheet!==id)document.getElementById(activeSheet).classList.remove('show');
  activeSheet=id;
  document.getElementById('overlay').classList.add('show');
  document.getElementById(id).classList.add('show');
}
function closeAll(){
  if(activeSheet)document.getElementById(activeSheet).classList.remove('show');
  activeSheet=null;
  document.getElementById('overlay').classList.remove('show');
  currentDetailIdx=-1;
}

// ── Confirm dialog ───────────────────────────────────────────────
var _confirmCb=null;
function showConfirm(msg,yesLabel,cb){
  _confirmCb=cb;
  document.getElementById('confirmMsg').textContent=msg;
  document.getElementById('confirmYesBtn').textContent=yesLabel||'Ja';
  document.getElementById('confirmOverlay').style.display='flex';
}
function confirmYes(){document.getElementById('confirmOverlay').style.display='none';if(_confirmCb)_confirmCb();_confirmCb=null;}
function confirmNo(){document.getElementById('confirmOverlay').style.display='none';_confirmCb=null;}

// ── Today banner ─────────────────────────────────────────────────
function renderTodayBanner(){
  var banner=document.getElementById('todayBanner');
  var active=conditions.filter(function(c){return needsTreatment[c.status]&&isDueToday(c);});
  if(active.length===0){
    banner.innerHTML='<div class="today-banner-title">Heute</div><div style="font-size:12px;color:#2a9d2a;padding:4px 0">✓ Nichts fällig.</div>';
    return;
  }
  var html='<div class="today-banner-title">Heute</div>';
  active.forEach(function(c){
    var done=allSlotsDoneToday(c);
    var count=logsTodayCount(c);
    var needed=c.timesPerDay||1;
    var col=statusColors[c.status];
    var waitH=hoursUntilNext(c);
    var statusTxt, statusCls;
    if(done){statusTxt='✓ fertig';statusCls='today-done';}
    else if(canLogNow(c)){statusTxt=count+'/'+needed+' fällig';statusCls='today-due';}
    else if(count>0){statusTxt=count+'/'+needed+' · '+Math.ceil(waitH)+'h warten';statusCls='today-pending';}
    else{statusTxt='0/'+needed;statusCls='today-due';}
    html+='<div class="today-item"><div class="today-dot" style="background:'+col.dot+'"></div>'
      +'<div class="today-name">'+c.name+'</div>'
      +'<div class="today-status '+statusCls+'">'+statusTxt+'</div></div>';
  });
  banner.innerHTML=html;
}

// ── Log action ────────────────────────────────────────────────────
function logToday(){
  if(currentDetailIdx<0)return;
  var c=conditions[currentDetailIdx];
  if(!canLogNow(c)){
    var waitH=hoursUntilNext(c);
    var allDone=allSlotsDoneToday(c);
    document.getElementById('dsFeedback').textContent=allDone?'Heute bereits alle Einheiten erledigt.':'Bitte noch '+Math.ceil(waitH)+'h warten.';
    document.getElementById('dsFeedback').style.color='#555';
    return;
  }
  var today=todayStr();
  if(!c.logsToday)c.logsToday={};
  if(!c.logsToday[today])c.logsToday[today]=[];
  c.logsToday[today].push(Date.now());

  var count=logsTodayCount(c);
  var needed=c.timesPerDay||1;

  // Advance day on first log of day
  if(count===1){
    c.day=Math.min(c.day+1,c.total||9999);
    if(c.status==='red'||c.status==='blue')c.status='amber';
  }
  // Streak when all done
  if(allSlotsDoneToday(c)){
    c.streak=Math.min((c.streak||0)+1,10);
    c.lastStreakDay=today;
  }

  saveConditions();renderList();
  var remaining=needed-count;
  var msg='Erledigt ✓ ('+count+'/'+needed+')';
  if(remaining>0){
    var waitH=hoursUntilNext(c);
    msg+=' · nächste in ~'+Math.ceil(waitH)+'h';
  } else {
    msg+=' · Heute komplett! Streak: '+c.streak+' ★';
  }
  document.getElementById('dsFeedback').textContent=msg;
  document.getElementById('dsFeedback').style.color=remaining===0?'#2a9d2a':'#e0874a';
  refreshDetailMeta(c);

  var btn=document.getElementById('erledigt-btn');
  if(btn){
    if(allSlotsDoneToday(c)){btn.disabled=true;btn.textContent='✓ Heute fertig';}
    else if(!canLogNow(c)){btn.disabled=true;btn.textContent='Warten ('+Math.ceil(hoursUntilNext(c))+'h)';}
  }
}

// ── Helpers ──────────────────────────────────────────────────────
function freqLabel(times,interval){if(!times||!times.length)return'–';var t=times.join(', ');if(interval>1)t+=' · alle '+interval+' Tage';return t;}
function toggleChip(el){el.classList.toggle('selected');}
function getSelectedTimes(){var v=[];document.querySelectorAll('#addSheet .freq-chip.selected').forEach(function(c){v.push(c.dataset.val);});return v.length?v:['egal'];}
function starsHtml(n,color){var s='';for(var i=0;i<Math.min(n,10);i++)s+='★';return n>0?'<span style="color:'+color+';font-size:11px;margin-left:5px">'+s+'</span>':'';}

// ── Render list ──────────────────────────────────────────────────
var currentDetailIdx=-1;
function renderList(){
  var list=document.getElementById('condList');
  list.innerHTML='';
  var hint=document.getElementById('listHint');
  if(conditions.length===0){hint.style.display='block';return;}
  hint.style.display='none';
  conditions.forEach(function(c,i){
    var col=statusColors[c.status]||statusColors.undiag;
    var pct=c.total>0?Math.round(c.day/c.total*100):0;
    var done=allSlotsDoneToday(c);
    var due=!done&&isDueToday(c)&&canLogNow(c);
    var dotStyle='width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:4px;background:'+col.dot+';';
    if(c.status==='undiag')dotStyle='width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:4px;background:#1a1a1a;border:1.5px dashed #444;';
    var sub=c.region+' · '+statusLabels[c.status];
    if(c.action)sub+=' · '+freqLabel(c);
    if(c.total>0)sub+=' · T'+c.day+'/'+c.total;
    var barHtml=(c.action&&c.total>0)?'<div class="bar-row"><div class="btrack"><div class="bfill" style="width:'+pct+'%;background:'+col.bar+'"></div></div></div>':'';
    var item=document.createElement('div');
    item.className='cond-item'+(done?' done-today':'');
    item.onclick=(function(idx){return function(){showDetail(idx);};})(i);
    var dueDot=due?'<div style="width:6px;height:6px;border-radius:50%;background:#cf4444;position:absolute;right:20px;top:16px"></div>':'';
    var doneBadge=done?'<div class="done-badge">✓</div>':'';
    item.innerHTML='<div style="'+dotStyle+'"></div>'
      +'<div class="cinfo">'
        +'<div class="cname" style="color:'+col.name+'">'+c.name+starsHtml(c.streak,col.dot)+'</div>'
        +'<div class="csub">'+sub+'</div>'
        +barHtml
      +'</div>'
      +'<div style="font-size:18px;color:#2a2a2a;padding-left:8px;flex-shrink:0">›</div>'
      +dueDot+doneBadge;
    list.appendChild(item);
  });
  updateBodyColors();
  renderTodayBanner();
}

// ── Detail sheet ─────────────────────────────────────────────────
function showDetail(i){
  currentDetailIdx=i;
  var c=conditions[i];
  var col=statusColors[c.status]||statusColors.undiag;
  document.getElementById('dsRegion').textContent=c.region.toUpperCase();
  document.getElementById('dsName').textContent=c.name;
  document.getElementById('dsName').style.color=col.name;
  document.getElementById('dsFeedback').textContent='';
  refreshDetailMeta(c);

  var hasTreatment=!!needsTreatment[c.status];
  var isUndiag=c.status==='undiag';
  var acts='';

  if(hasTreatment&&isDueToday(c)){
    var allDone=allSlotsDoneToday(c);
    var canLog=canLogNow(c);
    var count=logsTodayCount(c);
    var needed=c.timesPerDay||1;
    var btnLabel;
    if(allDone) btnLabel='✓ Heute fertig';
    else if(canLog) btnLabel='Erledigt ('+count+'/'+needed+')';
    else btnLabel='Warten ('+Math.ceil(hoursUntilNext(c))+'h)';
    acts+='<button id="erledigt-btn" class="dact primary"'+(!canLog||allDone?' disabled':'')+' onclick="logToday()">'+btnLabel+'</button>';
  } else if(hasTreatment&&!isDueToday(c)){
    acts+='<button class="dact" disabled>Nächster Behandlungstag in '+c.interval+'+ Tagen</button>';
  }

  if(isUndiag) acts+='<button class="dact primary" onclick="diagnoseThis()">Jetzt diagnostizieren</button>';
  acts+='<button class="dact secondary-action" onclick="editDiagnosis()">Bearbeiten</button>';
  acts+='<button class="dact green" onclick="markHealed()">✓ Geheilt – entfernen</button>';
  acts+='<button class="dact secondary-action" onclick="closeAll()">Schliessen</button>';
  document.getElementById('dsActions').innerHTML=acts;
  openSheet('detailSheet');
}

function refreshDetailMeta(c){
  var col=statusColors[c.status]||statusColors.undiag;
  var meta='<strong>Status:</strong> <span style="color:'+col.name+'">'+statusLabels[c.status]+'</span>';
  if(c.action) meta+='<br><strong>Übung:</strong> '+c.action;
  if(needsTreatment[c.status]){
    meta+='<br><strong>Frequenz:</strong> '+freqLabel(c);
    var count=logsTodayCount(c);
    var needed=c.timesPerDay||1;
    meta+='<br><strong>Heute:</strong> <span style="color:'+(count>=needed?'#2a9d2a':'#555')+'">'+count+' / '+needed+'</span>';
  }
  if(c.total>0) meta+='<br><strong>Fortschritt:</strong> Tag '+c.day+' / '+c.total+' ('+Math.round(c.day/c.total*100)+'%)';
  else if(c.action&&needsTreatment[c.status]) meta+='<br><strong>Behandlung:</strong> dauerhaft';
  if(c.streak>0) meta+='<br><strong>Streak:</strong> <span style="color:'+col.dot+'">'+Array(Math.min(c.streak,10)+1).join('★')+'</span> '+c.streak+' Tag'+(c.streak>1?'e':'');
  document.getElementById('dsMeta').innerHTML=meta;
  document.getElementById('dsName').style.color=col.name;
}

// ── Log actions ──────────────────────────────────────────────────
function logToday(){
  if(currentDetailIdx<0)return;
  var c=conditions[currentDetailIdx];
  if(isDoneToday(c)){
    document.getElementById('dsFeedback').textContent='Heute bereits erledigt.';
    document.getElementById('dsFeedback').style.color='#555';
    return;
  }
  c.day=Math.min(c.day+1,c.total||9999);
  if(c.status==='red'||c.status==='blue')c.status='amber';
  c.streak=Math.min((c.streak||0)+1,10);
  c.lastActed=todayStr();
  saveConditions();renderList();
  document.getElementById('dsFeedback').textContent='Heute erledigt ✓  Streak: '+c.streak;
  document.getElementById('dsFeedback').style.color='#2a9d2a';
  refreshDetailMeta(c);
  // Disable the button now
  var btn=document.querySelector('#dsActions .dact.primary');
  if(btn){btn.disabled=true;btn.textContent='✓ Heute erledigt';}
  var skipBtn=document.querySelector('#dsActions .dact.danger');
  if(skipBtn)skipBtn.style.display='none';
}

function markHealed(){
  if(currentDetailIdx<0)return;
  var idx=currentDetailIdx;
  showConfirm('"'+conditions[idx].name+'" als geheilt markieren und entfernen?','Entfernen',function(){
    conditions.splice(idx,1);currentDetailIdx=-1;
    saveConditions();renderList();updateBodyColors();renderTodayBanner();closeAll();
  });
}

// ── Region tap ───────────────────────────────────────────────────
function tapRegion(name){
  document.getElementById('tsTitle').textContent=name;
  document.getElementById('fRegion').value=name;
  var matches=[];conditions.forEach(function(c,i){if(c.region===name)matches.push({c:c,i:i});});
  var body=document.getElementById('tsBody');
  if(matches.length===0){
    body.innerHTML='<div style="font-size:13px;color:#333;padding:8px 0">Keine Diagnose für diese Region.</div>';
  } else {
    body.innerHTML='';
    matches.forEach(function(m){
      var col=statusColors[m.c.status]||statusColors.undiag;
      var row=document.createElement('div');
      row.className='tp-entry';
      row.innerHTML='<div style="width:9px;height:9px;border-radius:50%;background:'+col.dot+';flex-shrink:0"></div>'
        +'<div style="flex:1"><div style="font-size:14px;font-weight:500;color:'+col.name+'">'+m.c.name+'</div>'
        +'<div style="font-size:12px;color:#444;margin-top:2px">'+statusLabels[m.c.status]+'</div></div>'
        +'<div style="font-size:18px;color:#333">›</div>';
      row.onclick=(function(idx){return function(){showDetail(idx);};})(m.i);
      body.appendChild(row);
    });
  }
  openSheet('tapSheet');
}

// ── Form ─────────────────────────────────────────────────────────
function onStatusChange(){
  var st=document.getElementById('fStatus').value;
  var needs=!!needsTreatment[st];
  ['fActionRow','fDaysRow','fFreqRow'].forEach(function(id){
    document.getElementById(id).style.display=needs?'block':'none';
  });
}
function _openForm(opts){
  document.getElementById('addSheetTitle').textContent=opts.title||'Neue Diagnose';
  document.getElementById('addSubmitBtn').textContent=opts.btnLabel||'Eintragen';
  document.getElementById('addFeedback').textContent='';
  document.getElementById('addSheet').dataset.replacing=opts.replacing!==undefined?String(opts.replacing):'';
  document.getElementById('fName').value=opts.name||'';
  document.getElementById('fRegion').value=opts.region||'';
  document.getElementById('fStatus').value=opts.status||'red';
  document.getElementById('fAction').value=opts.action||'';
  document.getElementById('fDays').value=opts.days||30;
  document.getElementById('fTimesPerDay').value=opts.timesPerDay||1;
  document.getElementById('fInterval').value=opts.interval||1;
  onStatusChange();
  openSheet('addSheet');
}
function showAdd(){
  var preRegion=(activeSheet==='tapSheet')?document.getElementById('tsTitle').textContent:'';
  _openForm({region:preRegion});
}
function editDiagnosis(){
  if(currentDetailIdx<0)return;
  var c=conditions[currentDetailIdx];
  _openForm({title:'Bearbeiten',btnLabel:'Speichern',replacing:currentDetailIdx,
    name:c.name,region:c.region,status:c.status,action:c.action||'',
    days:c.total||30,timesPerDay:c.timesPerDay||1,interval:c.interval||1});
}
function diagnoseThis(){
  if(currentDetailIdx<0)return;
  var c=conditions[currentDetailIdx];
  _openForm({title:'Diagnose stellen',btnLabel:'Speichern',replacing:currentDetailIdx,
    name:c.name,region:c.region,status:'red',days:30,timesPerDay:1,interval:1});
}
function submitNew(){
  var region=document.getElementById('fRegion').value;
  var name=document.getElementById('fName').value.trim();
  var status=document.getElementById('fStatus').value;
  var fb=document.getElementById('addFeedback');
  if(!region||!name){fb.textContent='Region und Name sind Pflichtfelder.';return;}
  var needs=!!needsTreatment[status];
  var action='',timesPerDay=1,interval=1,days=0;
  if(needs){
    action=document.getElementById('fAction').value.trim();
    if(!action){fb.textContent='Bitte Übung/Aktion angeben.';return;}
    timesPerDay=parseInt(document.getElementById('fTimesPerDay').value)||1;
    interval=parseInt(document.getElementById('fInterval').value)||1;
    days=parseInt(document.getElementById('fDays').value)||30;
  }
  var replacing=document.getElementById('addSheet').dataset.replacing;
  var replacingIdx=parseInt(replacing);
  var isEdit=replacing!==''&&!isNaN(replacingIdx);
  var old=isEdit?conditions[replacingIdx]:{};
  var newEntry={name:name,region:region,action:action,timesPerDay:timesPerDay,interval:interval,
    day:old.day||0,total:days,status:status,streak:old.streak||0,logsToday:old.logsToday||{},lastStreakDay:old.lastStreakDay||''};
  if(isEdit)conditions[replacingIdx]=newEntry;
  else conditions.push(newEntry);
  saveConditions();renderList();closeAll();
  switchTab('list');
}

// ── Body colors ──────────────────────────────────────────────────
var regionToSvgIds={
  'Kopf':['fKopf'],'Nacken':['fNacken','bNacken'],
  'Rechte Schulter':['fSchulterR'],'Linke Schulter':['fSchulterL'],
  'Rechter Oberarm':['fOberarmR'],'Linker Oberarm':['fOberarmL'],
  'Brustkorb':['fBrust'],'Bauch':['fBauch'],'Hüfte':['fHuefte'],
  'Rechter Ellbogen':['fEllbogenR'],'Linker Ellbogen':['fEllbogenL'],
  'Rechter Unterarm':['fUnterarmR'],'Linker Unterarm':['fUnterarmL'],
  'Rechte Hand':['fHandR'],'Linke Hand':['fHandL'],
  'Rechter Oberschenkel':['fOberschenkelR'],'Linker Oberschenkel':['fOberschenkelL'],
  'Rechtes Knie':['fKnieR'],'Linkes Knie':['fKnieL'],
  'Rechter Unterschenkel':['fUnterschenkelR'],'Linker Unterschenkel':['fUnterschenkelL'],
  'Rechter Fuß':['fFussR'],'Linker Fuß':['fFussL'],
  'Hinterkopf':['bHinterkopf'],'Oberer Rücken':['bObererRuecken'],'Unterer Rücken':['bUntererRuecken'],
  'Gesäss':['bGesaess'],'Rechte Wade':['bWadeR'],'Linke Wade':['bWadeL'],
  'Rechte Kniekehle':['bKniekehleR'],'Linke Kniekehle':['bKniekehleL'],
  'Rechte Achillessehne':['bAchillesR'],'Linke Achillessehne':['bAchillesL'],
  'Rechte Ferse':['bFerseR'],'Linke Ferse':['bFerseL'],
  'Linke Schulter (hinten)':['bSchulterL'],'Rechte Schulter (hinten)':['bSchulterR'],
  'Rechter Oberarm (hinten)':['bOberarmR'],'Linker Oberarm (hinten)':['bOberarmL'],
  'Rechter Ellbogen (hinten)':['bEllbogenR'],'Linker Ellbogen (hinten)':['bEllbogenL'],
  'Rechter Unterarm (hinten)':['bUnterarmR'],'Linker Unterarm (hinten)':['bUnterarmL'],
  'Rechte Hand (hinten)':['bHandR'],'Linke Hand (hinten)':['bHandL'],
};
function updateBodyColors(){
  var regionStatus={};
  conditions.forEach(function(c){
    var p=statusPriority[c.status]||0;
    if(!regionStatus[c.region]||p>(statusPriority[regionStatus[c.region]]||0))regionStatus[c.region]=c.status;
  });
  Object.values(regionToSvgIds).forEach(function(ids){ids.forEach(function(id){
    var el=document.getElementById(id);if(!el)return;
    var sh=el.querySelector('ellipse,rect,circle');if(!sh)return;
    sh.setAttribute('fill',statusFills.none.fill);
    sh.setAttribute('stroke',statusFills.none.stroke);
    sh.setAttribute('stroke-width',statusFills.none.sw);
  });});
  Object.keys(regionStatus).forEach(function(region){
    var sf=statusFills[regionStatus[region]],ids=regionToSvgIds[region];if(!ids||!sf)return;
    ids.forEach(function(id){
      var el=document.getElementById(id);if(!el)return;
      var sh=el.querySelector('ellipse,rect,circle');if(!sh)return;
      sh.setAttribute('fill',sf.fill);
      sh.setAttribute('stroke',sf.stroke);
      sh.setAttribute('stroke-width',sf.sw);
    });
  });
}

renderList();
</script>

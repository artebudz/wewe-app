<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>WeWe</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Caveat:wght@400;600&display=swap');

/* ── Reset & base ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#e8e4db}
body{font-family:'Special Elite','Courier New',monospace;color:#1e1c18;display:flex;flex-direction:column}

/* ── Header ── */
.hdr{background:#faf8f2;border-bottom:2px solid #1e1c18;padding:12px 16px 10px;display:flex;justify-content:space-between;align-items:baseline;flex-shrink:0}
.appname{font-size:22px;letter-spacing:4px}
.hdr-right{display:flex;align-items:baseline;gap:10px}
.hdate{font-family:'Caveat',cursive;font-size:13px;color:#888}
.reset-btn{font-family:'Caveat',cursive;font-size:12px;color:#ccc;cursor:pointer;padding:4px}

/* ── Tab bar ── */
.tabs{display:flex;background:#faf8f2;border-bottom:1px solid #d8d4c8;flex-shrink:0}
.tab{flex:1;text-align:center;padding:11px 0 9px;font-family:'Caveat',cursive;font-size:14px;color:#aaa;cursor:pointer;border-bottom:2px solid transparent;transition:color .15s}
.tab.active{color:#1e1c18;border-bottom-color:#1e1c18}

/* ── Scrollable content area ── */
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:#e8e4db}
.tab-pane{display:none;min-height:100%}
.tab-pane.active{display:block}

/* ── Body figure tab ── */
.body-tab{display:flex;flex-direction:column;align-items:center;padding:16px 0 100px}
.svg-wrap{position:relative;width:180px}
.view-btns{display:flex;gap:0;margin-top:10px;border:1px solid #ccc;border-radius:3px;overflow:hidden;background:#faf8f2}
.vbtn{flex:1;padding:10px 0;font-family:'Caveat',cursive;font-size:14px;color:#aaa;text-align:center;cursor:pointer;transition:all .15s}
.vbtn.active{background:#1e1c18;color:#faf8f2}

/* ── List tab ── */
.list-tab{padding:0 0 100px}
.cond-item{display:flex;align-items:flex-start;gap:10px;padding:13px 16px;background:#faf8f2;border-bottom:1px solid #e0dccf;cursor:pointer;min-height:56px;-webkit-user-select:none;user-select:none}
.cond-item:active{background:#f0ece0}
.cinfo{flex:1;min-width:0}
.cname{font-size:14px;line-height:1.3}
.csub{font-family:'Caveat',cursive;font-size:12px;color:#888;margin-top:2px}
.bar-row{display:flex;align-items:center;gap:6px;margin-top:5px}
.btrack{flex:1;height:5px;background:#e8e4d8;border-radius:2px;overflow:hidden}
.bfill{height:100%;border-radius:2px;transition:width .3s}
.add-row{display:flex;align-items:center;gap:10px;padding:14px 16px;background:#faf8f2;border-bottom:1px dashed #ccc;cursor:pointer;min-height:52px}
.add-row:active{background:#f0ece0}
.plus-icon{width:26px;height:26px;border:1.5px solid #aaa;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;color:#aaa;line-height:1;flex-shrink:0}
.add-row span{font-family:'Caveat',cursive;font-size:15px;color:#888}

/* ── Bottom sheet overlay ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:90;opacity:0;pointer-events:none;transition:opacity .22s}
.overlay.show{opacity:1;pointer-events:all}
.sheet{position:fixed;bottom:0;left:0;right:0;background:#faf8f2;border-top:1.5px solid #c8c0a8;border-radius:16px 16px 0 0;z-index:100;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(100%);transition:transform .25s cubic-bezier(.4,0,.2,1)}
.sheet.show{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:#d0ccc0;border-radius:2px;margin:10px auto 0}
.sheet-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#888;padding:12px 18px 10px;border-bottom:1px solid #e8e4d8}
.sheet-body{padding:14px 18px 32px}

/* ── Detail sheet ── */
.d-region{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#888;margin-bottom:3px}
.d-name{font-family:'Caveat',cursive;font-size:20px;line-height:1.2;margin-bottom:8px}
.d-meta{font-family:'Caveat',cursive;font-size:13px;color:#666;line-height:2}
.d-actions{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.dact{width:100%;padding:14px 16px;font-family:'Special Elite',monospace;font-size:13px;letter-spacing:1px;border:1px solid #aaa;background:#faf8f2;cursor:pointer;border-radius:2px;text-align:left}
.dact:active{background:#ede9dc}
.dact.primary{border-color:#3b6d11;color:#3b6d11;background:#f2f9ee}
.dact.primary:active{background:#e4f2dc}
.dact.green{border-color:#4caf6e;color:#2a6b40;background:#f2faf5}
.dact.danger{border-color:#A32D2D;color:#A32D2D;background:#fdf2f2}
.pfeedback{font-family:'Caveat',cursive;font-size:13px;color:#888;margin-top:10px;min-height:18px}

/* ── Tap panel (region) ── */
.tp-entry{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eee;cursor:pointer;min-height:48px}
.tp-entry:active{opacity:.7}
.tp-entry:last-child{border-bottom:none}
.tp-arrow{font-family:'Caveat',cursive;font-size:14px;color:#ccc}

/* ── Form sheet ── */
.form-row{margin-bottom:14px}
.flabel{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#888;margin-bottom:4px}
.fval{font-family:'Caveat',cursive;font-size:16px;color:#1e1c18;border:none;border-bottom:1.5px solid #c8c0a8;background:transparent;width:100%;padding:4px 0;outline:none}
select.fval{cursor:pointer;-webkit-appearance:auto}
.freq-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.freq-chip{font-family:'Caveat',cursive;font-size:14px;padding:7px 14px;border:1px solid #c8c0a8;border-radius:20px;cursor:pointer;background:#faf8f2;color:#666;user-select:none;transition:all .1s;min-height:36px;display:flex;align-items:center}
.freq-chip:active{opacity:.7}
.freq-chip.selected{background:#1e1c18;color:#faf8f2;border-color:#1e1c18}
.freq-interval{display:flex;align-items:center;gap:8px;margin-top:8px}
.freq-interval input{width:56px;font-family:'Caveat',cursive;font-size:16px;color:#1e1c18;border:none;border-bottom:1.5px solid #c8c0a8;background:transparent;padding:4px 0;outline:none;text-align:center}
.freq-interval label{font-family:'Caveat',cursive;font-size:14px;color:#888}
.form-actions{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.fact{width:100%;padding:14px 16px;font-family:'Special Elite',monospace;font-size:13px;letter-spacing:1px;border:1px solid #aaa;background:#faf8f2;cursor:pointer;border-radius:2px;text-align:center}
.fact:active{background:#ede9dc}
.fact.primary{border-color:#3b6d11;color:#3b6d11;background:#f2f9ee}
.ferr{font-family:'Caveat',cursive;font-size:13px;color:#A32D2D;margin-top:8px;min-height:18px}

/* ── Confirm dialog ── */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px}
.confirm-box{background:#faf8f2;border:1px solid #c8c0a8;padding:22px 20px;max-width:320px;width:100%}
.confirm-msg{font-family:'Caveat',cursive;font-size:16px;color:#1e1c18;margin-bottom:18px;line-height:1.5}
.confirm-btns{display:flex;gap:10px}
.confirm-btns button{flex:1;padding:13px;font-family:'Special Elite',monospace;font-size:12px;letter-spacing:1px;border:1px solid #aaa;background:#faf8f2;cursor:pointer}
.confirm-btns button.yes{border-color:#A32D2D;color:#A32D2D}

/* ── Save indicator ── */
.save-ind{position:fixed;top:14px;right:16px;font-family:'Caveat',cursive;font-size:12px;color:#4caf6e;z-index:150;opacity:0;transition:opacity .3s}
.save-ind.show{opacity:1}

/* ── Hint ── */
.hint{font-family:'Caveat',cursive;font-size:12px;color:#aaa;padding:14px 16px;text-align:center}

/* ── SVG regions ── */
.region{cursor:pointer}
.region:active path,.region:active ellipse,.region:active rect,.region:active circle{opacity:.75}

/* ── Scrollbar styling ── */
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:2px}
</style>
</head>

<div class="sheet" id="addSheet" data-replacing="">
  <div class="sheet-handle"></div>

  <div class="sheet-body">

          <option>Rechter Oberschenkel</option><option>Linker Oberschenkel</option>
          <option>Rechtes Knie</option><option>Linkes Knie</option>

        <div class="freq-chip" data-val="egal" onclick="toggleChip(this)">egal wann</div>
        <div class="freq-chip" data-val="bedarf" onclick="toggleChip(this)">nach Bedarf</div>
      </div>

        <label>alle</label>

        <label>Tag(e)</label>

<div class="save-ind" id="saveInd">gespeichert ✓</div>

  <div class="confirm-box">
    <div class="confirm-msg" id="confirmMsg"></div>
    <div class="confirm-btns">
      <button onclick="confirmNo()">Abbrechen</button>
      <button class="yes" id="confirmYesBtn" onclick="confirmYes()">Löschen</button>
    </div>

<script>
// ── Storage ──────────────────────────────────────────────────────
var STORAGE_KEY='wewe_conditions';
var DEMO=[
  {name:'Schulterimpingement',region:'Rechte Schulter',action:'Pendulum-Übung',times:['morgens','abends'],interval:1,day:23,total:60,status:'red',streak:3},
  {name:'Meniskus-Reizung',region:'Linkes Knie',action:'Kräftigungsübung',times:['egal'],interval:2,day:14,total:45,status:'amber',streak:5},
  {name:'Chron. Hüftschwäche',region:'Hüfte',action:'Mobilisierungsübung',times:['morgens'],interval:1,day:0,total:0,status:'blue',streak:0},
  {name:'Alte Knieverletzung',region:'Rechtes Knie',action:'',times:[],interval:1,day:0,total:0,status:'blue_inactive',streak:0}
];
function loadConditions(){try{var r=localStorage.getItem(STORAGE_KEY);if(r)return JSON.parse(r);}catch(e){}return JSON.parse(JSON.stringify(DEMO));}
function saveConditions(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(conditions));}catch(e){}
  var ind=document.getElementById('saveInd');
  ind.classList.add('show');clearTimeout(ind._t);ind._t=setTimeout(function(){ind.classList.remove('show');},1400);
}
function resetData(){showConfirm('Alle Diagnosen wirklich löschen?','Löschen',function(){localStorage.removeItem(STORAGE_KEY);conditions=JSON.parse(JSON.stringify(DEMO));closeAll();renderList();updateBodyColors();});}

function todayStr(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}

var conditions=loadConditions();
// Auto-decay streak if missed >1 day
conditions.forEach(function(c){
  if(c.streak&&c.lastLogged&&c.lastLogged!==todayStr()){
    var last=new Date(c.lastLogged),today=new Date();today.setHours(0,0,0,0);
    if(Math.round((today-last)/86400000)>1)c.streak=0;
  }
});

// ── Status data ──────────────────────────────────────────────────
var statusColors={
  red:          {dot:'#E24B4A',name:'#A32D2D',bar:'#E24B4A'},
  amber:        {dot:'#BA7517',name:'#633806',bar:'#BA7517'},
  blue:         {dot:'#378ADD',name:'#185FA5',bar:'#378ADD'},
  blue_inactive:{dot:'#a8ccec',name:'#6699bb',bar:'#a8ccec'},
  probhealed:   {dot:'#4caf6e',name:'#2a6b40',bar:'#4caf6e'},
  undiag:       {dot:'#999',   name:'#555',   bar:'#999'}
};
var statusLabels={
  red:'Akut',amber:'Behandelt',blue:'Chronisch (aktiv)',
  blue_inactive:'Chronisch (inaktiv)',probhealed:'Wsl. gesund',undiag:'Undiagnostiziert'
};
var needsTreatment={red:true,amber:true,blue:true};
var statusFills={
  red:          {fill:'#f4a0a0',stroke:'#C93333',sw:'1.5'},
  amber:        {fill:'#f5c97a',stroke:'#9A5E0A',sw:'1.5'},
  blue:         {fill:'#7ab8f0',stroke:'#1a5fa8',sw:'1.5'},
  blue_inactive:{fill:'#cce0f5',stroke:'#7aadd4',sw:'0.8'},
  probhealed:   {fill:'#7dd4a0',stroke:'#2a7a48',sw:'1.5'},
  undiag:       {fill:'#bbb',   stroke:'#888',   sw:'1'},
  none:         {fill:'#f0f0ec',stroke:'#b0aa9a',sw:'0.8'}
};
var statusPriority={red:5,amber:4,blue:3,undiag:2,blue_inactive:1,probhealed:1};

// ── Tab switching ────────────────────────────────────────────────
var currentTab='body';
function switchTab(t){
  currentTab=t;
  document.getElementById('tab-body').className='tab'+(t==='body'?' active':'');
  document.getElementById('tab-list').className='tab'+(t==='list'?' active':'');
  document.getElementById('pane-body').className='tab-pane'+(t==='body'?' active':'');
  document.getElementById('pane-list').className='tab-pane'+(t==='list'?' active':'');
}

// ── View (front/back) ────────────────────────────────────────────
function setView(v){
  document.getElementById('svgFront').style.display=v==='front'?'block':'none';
  document.getElementById('svgBack').style.display=v==='back'?'block':'none';
  document.getElementById('btn-front').className='vbtn'+(v==='front'?' active':'');
  document.getElementById('btn-back').className='vbtn'+(v==='back'?' active':'');
  closeAll();
}

// ── Sheet management ─────────────────────────────────────────────
var activeSheet=null;
function openSheet(id){
  if(activeSheet)document.getElementById(activeSheet).classList.remove('show');
  activeSheet=id;
  document.getElementById('overlay').classList.add('show');
  document.getElementById(id).classList.add('show');
}
function closeAll(){
  if(activeSheet)document.getElementById(activeSheet).classList.remove('show');
  activeSheet=null;
  document.getElementById('overlay').classList.remove('show');
  currentDetailIdx=-1;
}

// ── Confirm dialog ───────────────────────────────────────────────
var _confirmCb=null;
function showConfirm(msg,yesLabel,cb){
  _confirmCb=cb;
  document.getElementById('confirmMsg').textContent=msg;
  document.getElementById('confirmYesBtn').textContent=yesLabel||'Ja';
  document.getElementById('confirmOverlay').style.display='flex';
}
function confirmYes(){document.getElementById('confirmOverlay').style.display='none';if(_confirmCb)_confirmCb();_confirmCb=null;}
function confirmNo(){document.getElementById('confirmOverlay').style.display='none';_confirmCb=null;}

// ── Date ─────────────────────────────────────────────────────────
document.getElementById('hdate').textContent=new Date().toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit',year:'numeric'});

// ── Helpers ──────────────────────────────────────────────────────
function freqLabel(times,interval){if(!times||!times.length)return'–';var t=times.join(' + ');if(interval>1)t+=', alle '+interval+' Tage';return t;}
function toggleChip(el){el.classList.toggle('selected');}
function getSelectedTimes(){var v=[];document.querySelectorAll('#addSheet .freq-chip.selected').forEach(function(c){v.push(c.dataset.val);});return v.length?v:['egal'];}
function stars(n){var s='';for(var i=0;i<Math.min(n,10);i++)s+='★';return s;}

// ── Render list ──────────────────────────────────────────────────
var currentDetailIdx=-1;
function renderList(){
  var list=document.getElementById('condList');
  list.innerHTML='';
  var hint=document.getElementById('listHint');
  if(conditions.length===0){hint.style.display='block';return;}
  hint.style.display='none';
  conditions.forEach(function(c,i){
    var col=statusColors[c.status]||statusColors.undiag;
    var pct=c.total>0?Math.round(c.day/c.total*100):0;
    var dotStyle='width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:3px;'+(
      c.status==='undiag'?'background:#ccc;border:1.5px dashed #888;':'background:'+col.dot+';');
    var starsHtml=c.streak>0?'<span style="font-size:10px;color:#BA7517;margin-left:5px">'+stars(c.streak)+'</span>':'';
    var sub=c.region+' · '+statusLabels[c.status];
    if(c.action)sub+=' · '+freqLabel(c.times,c.interval);
    if(c.total>0)sub+=' · T'+c.day+'/'+c.total;
    var barHtml=(c.action&&c.total>0)?
      '<div class="bar-row"><div class="btrack"><div class="bfill" style="width:'+pct+'%;background:'+col.bar+'"></div></div></div>':'';
    var item=document.createElement('div');
    item.className='cond-item';
    item.onclick=(function(idx){return function(){showDetail(idx);};})(i);
    item.innerHTML='<div style="'+dotStyle+'"></div>'
      +'<div class="cinfo">'
        +'<div class="cname" style="color:'+col.name+'">'+c.name+starsHtml+'</div>'
        +'<div class="csub">'+sub+'</div>'
        +barHtml
      +'</div>'
      +'<div style="font-family:\'Caveat\',cursive;font-size:18px;color:#ccc;padding-left:6px">›</div>';
    list.appendChild(item);
  });
  updateBodyColors();
}

// ── Detail sheet ─────────────────────────────────────────────────
function showDetail(i){
  currentDetailIdx=i;
  var c=conditions[i];
  var col=statusColors[c.status]||statusColors.undiag;
  document.getElementById('dsRegion').textContent=c.region.toUpperCase();
  document.getElementById('dsName').textContent=c.name;
  document.getElementById('dsName').style.color=col.name;
  document.getElementById('dsFeedback').textContent='';

  var meta='Status: <strong style="color:'+col.name+'">'+statusLabels[c.status]+'</strong>';
  if(c.action)meta+='<br>Aktion: '+c.action;
  if(c.times&&c.times.length)meta+='<br>Frequenz: '+freqLabel(c.times,c.interval);
  if(c.total>0)meta+='<br>Fortschritt: Tag '+c.day+' von '+c.total;
  else if(c.action)meta+='<br>Behandlung: dauerhaft';
  if(c.streak>0)meta+='<br>Streak: <span style="color:#BA7517">'+stars(c.streak)+'</span> ('+c.streak+' Tag'+(c.streak>1?'e':'')+')';
  document.getElementById('dsMeta').innerHTML=meta;

  var hasTreatment=!!needsTreatment[c.status];
  var isUndiag=c.status==='undiag';
  var acts='';
  if(hasTreatment)acts+='<button class="dact primary" onclick="logToday()">✓ Heute erledigt</button><button class="dact danger" onclick="logSkip()">✗ Heute ausgelassen</button>';
  if(isUndiag)acts+='<button class="dact primary" onclick="diagnoseThis()">Jetzt diagnostizieren</button>';
  acts+='<button class="dact" onclick="editDiagnosis()">Diagnose ändern</button>';
  acts+='<button class="dact green" onclick="markHealed()">✓ Geheilt – löschen</button>';
  acts+='<button class="dact" onclick="closeAll()">Schliessen</button>';
  document.getElementById('dsActions').innerHTML=acts;

  openSheet('detailSheet');
  if(currentTab==='body')switchTab('list');
}

// ── Log actions ──────────────────────────────────────────────────
function logToday(){
  if(currentDetailIdx<0)return;
  var c=conditions[currentDetailIdx];
  c.day=Math.min(c.day+1,c.total||999);
  if(c.status==='red'||c.status==='blue')c.status='amber';
  c.streak=Math.min((c.streak||0)+1,10);
  c.lastLogged=todayStr();
  saveConditions();renderList();
  document.getElementById('dsFeedback').textContent='Heute erledigt ✓';
  document.getElementById('dsFeedback').style.color='#3b6d11';
  // refresh meta
  var col=statusColors[c.status]||statusColors.undiag;
  document.getElementById('dsName').style.color=col.name;
  var meta='Status: <strong style="color:'+col.name+'">'+statusLabels[c.status]+'</strong>';
  if(c.action)meta+='<br>Aktion: '+c.action;
  if(c.total>0)meta+='<br>Fortschritt: Tag '+c.day+' von '+c.total;
  if(c.streak>0)meta+='<br>Streak: <span style="color:#BA7517">'+stars(c.streak)+'</span> ('+c.streak+' Tag'+(c.streak>1?'e':'')+')';
  document.getElementById('dsMeta').innerHTML=meta;
}
function logSkip(){
  if(currentDetailIdx<0)return;
  var c=conditions[currentDetailIdx];
  if(c.status==='amber')c.status='red';
  c.streak=0;
  c.day=Math.max(0,(c.day||0)-1);
  saveConditions();renderList();
  document.getElementById('dsFeedback').textContent='Ausgelassen · Fortschritt –1';
  document.getElementById('dsFeedback').style.color='#A32D2D';
  var col=statusColors[c.status]||statusColors.undiag;
  document.getElementById('dsName').style.color=col.name;
  var meta='Status: <strong style="color:'+col.name+'">'+statusLabels[c.status]+'</strong>';
  if(c.action)meta+='<br>Aktion: '+c.action;
  if(c.total>0)meta+='<br>Fortschritt: Tag '+c.day+' von '+c.total;
  document.getElementById('dsMeta').innerHTML=meta;
}
function markHealed(){
  if(currentDetailIdx<0)return;
  var idx=currentDetailIdx;
  showConfirm('Diagnose "'+conditions[idx].name+'" als geheilt markieren und löschen?','Löschen',function(){
    conditions.splice(idx,1);
    currentDetailIdx=-1;
    saveConditions();renderList();closeAll();
  });
}

// ── Region tap ───────────────────────────────────────────────────
function tapRegion(name){
  document.getElementById('tsTitle').textContent=name;
  document.getElementById('fRegion').value=name;
  var matches=[];
  conditions.forEach(function(c,i){if(c.region===name)matches.push({c:c,i:i});});
  var body=document.getElementById('tsBody');
  if(matches.length===0){
    body.innerHTML='<div style="font-family:\'Caveat\',cursive;font-size:14px;color:#aaa;padding:6px 0">Keine Diagnose erfasst.</div>';
  } else {
    body.innerHTML='';
    matches.forEach(function(m){
      var col=statusColors[m.c.status]||statusColors.undiag;
      var row=document.createElement('div');
      row.className='tp-entry';
      row.innerHTML='<div style="width:10px;height:10px;border-radius:50%;background:'+col.dot+';flex-shrink:0"></div>'
        +'<div style="flex:1"><div style="font-family:\'Special Elite\',monospace;font-size:14px;color:'+col.name+'">'+m.c.name+'</div>'
        +'<div style="font-family:\'Caveat\',cursive;font-size:12px;color:#aaa">'+statusLabels[m.c.status]+'</div></div>'
        +'<div class="tp-arrow">›</div>';
      row.onclick=(function(idx){return function(){showDetail(idx);};})(m.i);
      body.appendChild(row);
    });
  }
  openSheet('tapSheet');
}

// ── Add/Edit form ────────────────────────────────────────────────
function onStatusChange(){
  var st=document.getElementById('fStatus').value;
  var needs=!!needsTreatment[st];
  document.getElementById('fActionRow').style.display=needs?'block':'none';
  document.getElementById('fDaysRow').style.display=needs?'block':'none';
  document.getElementById('fFreqRow').style.display=needs?'block':'none';
}

function _openForm(opts){
  document.getElementById('addSheetTitle').textContent=opts.title||'Neue Diagnose';
  document.getElementById('addSubmitBtn').textContent=opts.btnLabel||'Eintragen';
  document.getElementById('addFeedback').textContent='';
  document.getElementById('addSheet').dataset.replacing=opts.replacing!==undefined?String(opts.replacing):'';
  document.getElementById('fName').value=opts.name||'';
  document.getElementById('fRegion').value=opts.region||'';
  document.getElementById('fStatus').value=opts.status||'red';
  document.getElementById('fAction').value=opts.action||'';
  document.getElementById('fDays').value=opts.days||30;
  document.getElementById('fInterval').value=opts.interval||1;
  var sel=opts.times&&opts.times.length?opts.times:['morgens'];
  document.querySelectorAll('#addSheet .freq-chip').forEach(function(ch){
    ch.classList.toggle('selected',sel.indexOf(ch.dataset.val)>=0);
  });
  onStatusChange();
  openSheet('addSheet');
}
function showAdd(){
  var preRegion=document.getElementById('tsTitle').textContent||'';
  // only use it if tapSheet was actually open
  if(activeSheet!=='tapSheet')preRegion='';
  _openForm({region:preRegion});
}
function editDiagnosis(){
  if(currentDetailIdx<0)return;
  var c=conditions[currentDetailIdx];
  _openForm({title:'Diagnose ändern',btnLabel:'Speichern',replacing:currentDetailIdx,
    name:c.name,region:c.region,status:c.status,action:c.action||'',
    days:c.total||30,interval:c.interval||1,times:c.times||['morgens']});
}
function diagnoseThis(){
  if(currentDetailIdx<0)return;
  var c=conditions[currentDetailIdx];
  _openForm({title:'Diagnose stellen',btnLabel:'Speichern',replacing:currentDetailIdx,
    name:c.name,region:c.region,status:'red',days:30,interval:1,times:['morgens']});
}
function submitNew(){
  var region=document.getElementById('fRegion').value;
  var name=document.getElementById('fName').value.trim();
  var status=document.getElementById('fStatus').value;
  var fb=document.getElementById('addFeedback');
  if(!region||!name){fb.textContent='Bitte Region und Name angeben.';fb.style.color='#A32D2D';return;}
  var needs=!!needsTreatment[status];
  var action='',times=[],interval=1,days=0;
  if(needs){
    action=document.getElementById('fAction').value.trim();
    if(!action){fb.textContent='Bitte Aktion/Übung angeben.';fb.style.color='#A32D2D';return;}
    times=getSelectedTimes();
    interval=parseInt(document.getElementById('fInterval').value)||1;
    days=parseInt(document.getElementById('fDays').value)||30;
  }
  var replacing=document.getElementById('addSheet').dataset.replacing;
  var replacingIdx=parseInt(replacing);
  var isEdit=replacing!==undefined&&replacing!==''&&!isNaN(replacingIdx);
  var oldDay=isEdit?conditions[replacingIdx].day:0;
  var oldStreak=isEdit?conditions[replacingIdx].streak:0;
  var newEntry={name:name,region:region,action:action,times:times,interval:interval,day:oldDay,total:days,status:status,streak:oldStreak};
  if(isEdit)conditions[replacingIdx]=newEntry;
  else conditions.push(newEntry);
  saveConditions();renderList();closeAll();
  switchTab('list');
}

// ── Body colors ──────────────────────────────────────────────────
var regionToSvgIds={
  'Kopf':['fKopf'],'Nacken':['fNacken','bNacken'],
  'Rechte Schulter':['fSchulterR'],'Linke Schulter':['fSchulterL'],
  'Rechter Oberarm':['fOberarmR'],'Linker Oberarm':['fOberarmL'],
  'Brustkorb':['fBrust'],'Bauch':['fBauch'],'Hüfte':['fHüfte'],
  'Rechter Ellbogen':['fEllbogenR'],'Linker Ellbogen':['fEllbogenL'],
  'Rechter Unterarm':['fUnterarmR'],'Linker Unterarm':['fUnterarmL'],
  'Rechte Hand':['fHandR'],'Linke Hand':['fHandL'],
  'Rechter Oberschenkel':['fOberschenkelR'],'Linker Oberschenkel':['fOberschenkelL'],
  'Rechtes Knie':['fKnieR'],'Linkes Knie':['fKnieL'],
  'Rechter Unterschenkel':['fUnterschenkelR'],'Linker Unterschenkel':['fUnterschenkelL'],
  'Rechter Fuß':['fFussR'],'Linker Fuß':['fFussL'],
  'Hinterkopf':['bHinterkopf'],'Oberer Rücken':['bObererRuecken'],'Unterer Rücken':['bUntererRuecken'],
